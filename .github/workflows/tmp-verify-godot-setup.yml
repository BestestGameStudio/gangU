name: TEMP verify Godot setup
on:
  push:
    branches: [ci/claude-godot-images]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Headless test harness
        run: timeout 300 godot --headless -s scripts/test10_pickup_flow.gd
      - name: Rendered frames under xvfb
        run: |
          mkdir -p /tmp/shots
          timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" godot --rendering-driver opengl3 --path . --write-movie /tmp/shots/frame.png --fixed-fps 30 --quit-after 60
          ls -la /tmp/shots | tail -3
          ffmpeg -loglevel error -y -framerate 30 -i /tmp/shots/frame%08d.png -pix_fmt yuv420p /tmp/shots/clip.mp4 && ls -la /tmp/shots/clip.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: /tmp/shots/frame00000059.png
      - name: Image download from user-attachments
        run: |
          url=$(gh issue view 238 --json body,comments -q '[.body, .comments[].body] | join("\n")' | grep -oE 'https://github.com/user-attachments/assets/[A-Za-z0-9-]+' | head -1)
          echo "url=$url"
          if [ -n "$url" ]; then curl -fsSL "$url" -o /tmp/img && file /tmp/img; fi
        env:
          GH_TOKEN: ${{ github.token }}
