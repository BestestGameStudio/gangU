name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      media-files: ${{ steps.media.outputs.files }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Claude gets this command instead of curl, so it can only fetch from
      # github.com. It lives outside the workspace, where Claude cannot edit it.
      - name: Install github-fetch
        run: |
          sudo tee /usr/local/bin/github-fetch > /dev/null <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "$#" -ne 2 ]; then
            echo "usage: github-fetch https://github.com/PATH OUTPUT_FILE" >&2
            exit 2
          fi
          case "$1" in
            https://github.com/*) ;;
            *)
              echo "github-fetch: only https://github.com/ URLs are allowed" >&2
              exit 1
              ;;
          esac
          exec curl --fail --silent --show-error --location --globoff \
            --proto '=https' --proto-redir '=https' --max-redirs 5 \
            --output "$2" "$1"
          EOF
          sudo chmod 755 /usr/local/bin/github-fetch

      # Claude may only write inside its working directories; /tmp/ci is
      # added as one (--add-dir below) for renders and downloads.
      - name: Create scratch dir
        run: mkdir -p /tmp/ci/media

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: "4.5.1"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Images attached to the triggering issue/PR and its comments are
          # downloaded by the action itself and handed to Claude as local files.
          # How to use everything installed here lives in the ci-runner skill
          # (.claude/skills/ci-runner), which Claude can update via normal PRs.
          # Note: allowing godot already means Claude can run arbitrary code in
          # this job (GDScript can call OS.execute), so this list keeps Claude on
          # the intended path; it is not a sandbox.
          claude_args: |
            --allowedTools "Bash(github-fetch:*),Bash(godot:*),Bash(xvfb-run:*),Bash(timeout:*),Bash(ffmpeg:*),Bash(ffprobe:*),Bash(mkdir:*),Bash(python3 -I tools/sprites/extract_frames.py:*),Bash(python3 -I tools/sprites/pack_alpha_strip.py:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --add-dir /tmp/ci
            --append-system-prompt "You are running in the gangU GitHub Actions job, not on a developer machine. Before doing anything else, load the ci-runner skill: it lists what is installed (Godot 4.5.1, xvfb, ffmpeg, python3 with numpy and Pillow), which commands are allowed, how to run test harnesses, take screenshots, and get images from issues into the repo with github-fetch. Write scratch files (renders, downloads) only under /tmp/ci. It overrides local-only steps in the other gangU skills. Always run the relevant test harnesses before pushing and report the real results. Screenshot evidence is required: whenever your work changes or concerns anything visible or playable, save screenshots (or a short clip) proving it to /tmp/ci/media before you finish; the workflow attaches a download link to your comment automatically. If no screenshot is relevant, say why in one line. This run is ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}; put that URL under a Screenshots heading in any PR body you prefill."

      # Screenshots/clips Claude saves in /tmp/ci/media are attached to the run
      # as a zip; the evidence-link job below puts the download link in
      # Claude's comment.
      - name: List screenshot evidence
        id: media
        if: always()
        run: |
          files=$(cd /tmp/ci/media 2>/dev/null && find . -type f -printf '%P\n' | LC_ALL=C sort | tr -c 'A-Za-z0-9._/\n-' '_' | head -50 || true)
          { echo 'files<<__END_FILES__'; echo "$files"; echo '__END_FILES__'; } >> "$GITHUB_OUTPUT"

      - name: Upload screenshot evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-ci-output
          path: /tmp/ci/media
          if-no-files-found: ignore
          retention-days: 14

  # Runs after Claude has finished (and updated its comment), with its own
  # write-scoped token that the Claude job never sees.
  evidence-link:
    needs: claude
    if: always() && needs.claude.outputs.artifact-url != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Add screenshot download link to Claude's comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_URL: ${{ needs.claude.outputs.artifact-url }}
          FILES: ${{ needs.claude.outputs.media-files }}
        run: |
          set -euo pipefail
          list=$(printf '%s\n' "$FILES" | sed '/^$/d; s/.*/- `&`/')
          section=$(printf '**Screenshot evidence:** [download claude-ci-output.zip](%s) (kept 14 days; GitHub login required)\n%s' "$ARTIFACT_URL" "$list")
          # Claude's own comment for this run links to actions/runs/<run id>.
          find_comment() {
            gh api --paginate "repos/$REPO/$1/$NUMBER/comments" \
              --jq ".[] | select(.body | contains(\"actions/runs/$RUN_ID\")) | .id" 2>/dev/null | tail -1 || true
          }
          kind=issues; id=$(find_comment issues)
          if [ -z "$id" ]; then kind=pulls; id=$(find_comment pulls); fi
          if [ -n "$id" ]; then
            body=$(gh api "repos/$REPO/$kind/comments/$id" --jq .body)
            case "$body" in *"$ARTIFACT_URL"*) echo "link already present"; exit 0 ;; esac
            if gh api -X PATCH "repos/$REPO/$kind/comments/$id" -f body="$body"$'\n\n---\n'"$section" > /dev/null; then
              echo "appended to $kind comment $id"; exit 0
            fi
          fi
          echo "Claude's comment not found or not editable; posting a new comment"
          gh issue comment "$NUMBER" -R "$REPO" --body "$section"
