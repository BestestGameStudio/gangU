name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # PRs that @claude opens (and its pushes to them) are triggered by the
          # claude[bot] actor; without this the action refuses to review them.
          allowed_bots: 'claude'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Repo rule enforced by review: visible/playable changes need
          # screenshot evidence (see .claude/skills/ci-runner, "Screenshot evidence").
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "gangU repository rule, treat it like a CLAUDE.md rule: a PR that changes anything visible or playable (game/, assets/, data/, or UI/HUD) must include screenshot evidence. Evidence is any image in the PR description or PR comments (markdown image, <img> tag, or a github.com/user-attachments link), a claude-ci-output artifact link, or a GitHub Actions run URL given under a Screenshots heading. Read the PR description and comments with gh pr view <number> --comments. If the rule applies and there is no evidence, report it in your review comment as a finding titled Missing screenshot evidence, naming the visible change that needs a screenshot. Report it even if you found no code issues; it is not subject to the usual confidence filter. If the PR only touches CI, docs, tests or tooling, the rule does not apply; do not mention it."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

