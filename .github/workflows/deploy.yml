name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scope the concurrency group per ref (issue #52): PR check runs use
  # refs/pull/<n>/merge and main deploys use refs/heads/main, so PR
  # activity can no longer cancel a pending main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Pinned to the Godot version in project.godot (4.5.1-stable).
      image: barichello/godot-ci:4.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Web (nothreads) export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          ok=0
          for attempt in 1 2 3 4; do
            if timeout --kill-after=10 300 wget --tries=1 --continue --timeout=60 --progress=dot:giga -o "/tmp/dl_attempt_${attempt}.log" -O /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz; then
              ok=1
              break
            else
              rc=$?
              echo "template download attempt ${attempt}/4 failed (exit ${rc}); last log lines:" >&2
              tail -n 5 "/tmp/dl_attempt_${attempt}.log" >&2
            fi
            if [ "$attempt" -lt 4 ]; then sleep 15; fi
          done
          if [ "$ok" -ne 1 ] || [ ! -s /tmp/templates.tpz ]; then
            echo "template download FAILED after 4 attempts (no further network calls)" >&2
            rm -f /tmp/templates.tpz
            exit 1
          fi
          unzip -t -qq /tmp/templates.tpz "templates/web_nothreads_debug.zip" "templates/web_nothreads_release.zip" >/dev/null || { echo "template archive failed integrity check" >&2; exit 1; }
          unzip -o -j /tmp/templates.tpz "templates/web_nothreads_debug.zip" "templates/web_nothreads_release.zip" -d "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          rm -f /tmp/templates.tpz
      - name: Export Web build
        run: |
          godot --headless --path . --import
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Upload inspectable artifact
        uses: actions/upload-artifact@v4
        with:
          name: gangu-web-build
          path: build/web
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    # Only publish on real main-branch pushes, never from PR checks.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
