name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Pinned to the Godot version in project.godot (4.5.1-stable).
      image: barichello/godot-ci:4.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Web (nothreads) export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          wget -q -O /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          unzip -o -j /tmp/templates.tpz "templates/web_nothreads_debug.zip" "templates/web_nothreads_release.zip" -d "$HOME/.local/share/godot/export_templates/4.5.1.stable/"
          rm -f /tmp/templates.tpz
      - name: Export Web build
        run: |
          godot --headless --path . --import
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Upload inspectable artifact
        uses: actions/upload-artifact@v4
        with:
          name: gangu-web-build
          path: build/web
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    # Only publish on real main-branch pushes, never from PR checks.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
