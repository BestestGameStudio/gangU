name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scope the concurrency group per ref (issue #52): PR check runs use
  # refs/pull/<n>/merge and main deploys use refs/heads/main, so PR
  # activity can no longer cancel a pending main deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Pinned to the Godot version in project.godot (4.5.1-stable).
      image: barichello/godot-ci:4.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Web (nothreads) export templates
        run: |
          set -eu
          source_dir=/root/.local/share/godot/export_templates/4.5.1.stable
          template_dir="$HOME/.local/share/godot/export_templates/4.5.1.stable"
          # These hashes match the official Godot 4.5.1 export-template archive.
          # Use the templates already shipped in the pinned CI image, without a
          # second network download. Missing, changed or corrupt files fail closed.
          printf '%s  %s\n' \
            db624373952bdbffef4476b248fb70e89a483b525ac6de4438bee31ca2924728 "$source_dir/web_nothreads_debug.zip" \
            7f6c5efc9952f6f02509adfb92298161c0152a1f6a81c0bf9b9f4f913676e9c8 "$source_dir/web_nothreads_release.zip" \
            | sha256sum -c -
          for name in web_nothreads_debug.zip web_nothreads_release.zip; do
            unzip -t -qq "$source_dir/$name"
          done
          mkdir -p "$template_dir"
          if [ "$source_dir" != "$template_dir" ]; then
            cp "$source_dir/web_nothreads_debug.zip" "$source_dir/web_nothreads_release.zip" "$template_dir/"
          fi
      - name: Export Web build
        run: |
          godot --headless --path . --import
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Upload inspectable artifact
        uses: actions/upload-artifact@v4
        with:
          name: gangu-web-build
          path: build/web
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    # Only publish on real main-branch pushes, never from PR checks.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
